# Reverse proxy in front of the API. It is the only service published to the host (HTTP_PORT, default 8080 -> 80).
# docker-compose mounts this file over /etc/nginx/nginx.conf, so it is the complete configuration.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 1m;

    # The logs must never contain a query string, because GET /patient/search?national_id=... carries national IDs.
    # - Access log: $uri is the path only, whereas $request and $request_uri would include the query.
    # - Error log: whenever an upstream call fails, nginx prints the full request line and upstream URL, query
    #   included, at level "error". Only critical messages are kept; a failed upstream call still appears in
    #   the access log as 502/504 with its duration, and the API logs the details.
    # - GET /patient/search/{id} carries a national or passport ID in the path itself, so that path is logged
    #   as a template.
    map $uri $loggable_uri {
        "~^/patient/search/." "/patient/search/{id}";
        default                       $uri;
    }
    log_format api_access '$remote_addr [$time_local] "$request_method $loggable_uri" $status $body_bytes_sent ${request_time}s';
    access_log /dev/stdout api_access;
    error_log /dev/stderr crit;

    # Brute-force protection for the unauthenticated staff endpoints: 30 requests per minute per client IP.
    # The burst of 40 lets a quick manual or Postman walkthrough, or two back-to-back e2e runs, through;
    # beyond it nginx answers 429.
    limit_req_zone $binary_remote_addr zone=staff_auth:10m rate=30r/m;

    # Patient search: one bucket per access token, so colleagues behind one office IP do not slow each other down.
    # The key is the token itself, not the whole header: the API accepts "Bearer x", "bearer x" and "Bearer   x"
    # alike, so they must share one bucket. A request without a bearer token falls back to the client IP.
    # Rotating fake tokens does not help an attacker: those requests are answered 401 and never reach a HIS.
    map $http_authorization $patient_limit_key {
        "~*^\s*bearer\s+(?<bearer_token>\S+)\s*$" $bearer_token;
        default                                   $binary_remote_addr;
    }
    limit_req_zone $patient_limit_key zone=patient_search:10m rate=120r/m;
    limit_req_status 429;

    upstream api {
        server app:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # Responses carry patient data and access tokens, so no cache may keep a copy. The API's own
        # Cache-Control header is dropped so the browser does not see the directive twice.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        # Proxy settings below are inherited by every location that does not set its own proxy_set_header.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx is the only entry point, so overwrite X-Forwarded-For instead of appending to a client-supplied value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # Docker health checks call this every few seconds; keep them out of the access log.
        location = /health {
            access_log off;
            proxy_pass http://api;
        }

        location /staff/ {
            limit_req zone=staff_auth burst=40 nodelay;
            proxy_pass http://api;
        }

        # Every search with a national or passport ID can call the hospital's HIS: 120 requests a minute per token,
        # burst 60, which stops ID guessing and keeps one user from flooding the HIS.
        location /patient/ {
            limit_req zone=patient_search burst=60 nodelay;
            proxy_pass http://api;
        }

        location / {
            proxy_pass http://api;
        }

        # Errors nginx answers itself get a JSON body in the same shape as every other API error.
        error_page 429 @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":{"code":"rate_limited","message":"too many requests, try again later"}}';
        }

        error_page 413 @payload_too_large;
        location @payload_too_large {
            default_type application/json;
            return 413 '{"error":{"code":"payload_too_large","message":"request body is too large"}}';
        }
    }
}
