# Local stack: nginx (the only published port) -> api -> postgres, plus a mock Hospital A HIS.
#
#   cp .env.example .env
#   docker compose up --build        # API through nginx: http://localhost:8080 (HTTP_PORT in .env changes the port)
#
# Settings that are not secrets are fixed here; the ones you may change come from .env (see .env.example).
name: hospital-middleware

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hospital_middleware
      POSTGRES_USER: ${POSTGRES_USER:-hospital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # $$ stops compose from substituting the variable: the shell inside the container expands it.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d hospital_middleware"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stands in for https://hospital-a.api.co.th, which is not reachable. Same image as the API.
  mock-his:
    build: .
    image: hospital-middleware:local
    command: ["/app/mockhis"]
    restart: unless-stopped
    environment:
      MOCK_HIS_PORT: "8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  app:
    build: .
    image: hospital-middleware:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mock-his:
        condition: service_healthy
    environment:
      APP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-hospital}:${POSTGRES_PASSWORD}@db:5432/hospital_middleware?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters)}
      JWT_TTL: ${JWT_TTL:-1h}
      HIS_BASE_URLS: ${HIS_BASE_URLS:-hospital-a=http://mock-his:8081}
      HIS_TIMEOUT: ${HIS_TIMEOUT:-3s}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STAFF_REGISTRATION_KEY: ${STAFF_REGISTRATION_KEY:-}
      GIN_MODE: release
    # No `ports`: the API is reachable only through nginx. /health answers 503 while the database is down.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      # Goes through the proxy to the API, so "healthy" means the whole path from nginx to the database works.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  db-data:
